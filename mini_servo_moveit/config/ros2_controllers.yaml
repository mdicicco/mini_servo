# ros2_control controller manager configuration
controller_manager:
  ros__parameters:
    update_rate: 100

    mini_servo_arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

mini_servo_arm_controller:
  ros__parameters:
    joints:
      - mini_servo_joint_1
      - mini_servo_joint_2
      - mini_servo_joint_3
      - mini_servo_joint_4
      - mini_servo_joint_5
      - mini_servo_joint_6
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    allow_nonzero_velocity_at_trajectory_end: true
    interpolate_from_desired_state: true
