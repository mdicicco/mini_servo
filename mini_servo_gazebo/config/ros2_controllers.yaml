# Controllers loaded by gz_ros2_control inside Gazebo.
controller_manager:
  ros__parameters:
    update_rate: 1000  # Hz, matches Gazebo's default 1 ms physics step

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    forward_position_controller:
      type: forward_command_controller/ForwardCommandController

joint_state_broadcaster:
  ros__parameters: {}

# Feedforward position controller: writes commanded positions straight
# through to the Gazebo hardware interfaces.
forward_position_controller:
  ros__parameters:
    type: forward_command_controller/ForwardCommandController
    joints:
      - mini_servo_joint_1
      - mini_servo_joint_2
      - mini_servo_joint_3
      - mini_servo_joint_4
      - mini_servo_joint_5
      - mini_servo_joint_6
    interface_name: position
